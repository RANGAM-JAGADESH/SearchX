

services:

  postgres:

    image: postgres:16

    container_name: searchx-postgres

    restart: always

    environment:
      POSTGRES_DB: searchx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7

    container_name: searchx-redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  elasticsearch:

    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0

    container_name: searchx-elasticsearch

    restart: always

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  api:

    build: .

    container_name: searchx-api

    restart: always

    depends_on:
      - postgres
      - redis
      - elasticsearch

    env_file:
      - .env

    ports:
      - "8000:8000"

volumes:

  postgres_data:

  redis_data:

  elastic_data: